# Lab guests keep /var/log/journal on a RAM-backed tmpfs that is charged to the
# container's memory limit and cannot be reclaimed or swapped. Unbounded, it
# grew to 951 MiB of a 1 GiB guest and the kernel OOM-killed CouchDB on every
# start (5,127 restarts, September 17, 2026). Keep it far below any role limit.
[Journal]
SystemMaxUse=48M
RuntimeMaxUse=48M
SystemMaxFileSize=8M
RuntimeMaxFileSize=8M
