<div id="acdc_wrapper" class="acdc-app">
	<header class="acdc-header">
		<div>
			<h1>{{i18n.acdc.title}}</h1>
			<p>{{i18n.acdc.subtitle}} {{accountName}}</p>
		</div>
		<nav class="acdc-tabs" aria-label="{{i18n.acdc.navigation}}">
			<button type="button" class="acdc-tab" data-tab="dashboard"><i class="fa fa-dashboard"></i> {{i18n.acdc.tabs.dashboard}}</button>
			<button type="button" class="acdc-tab" data-tab="queues"><i class="fa fa-list"></i> {{i18n.acdc.tabs.queues}}</button>
			<button type="button" class="acdc-tab" data-tab="agents"><i class="fa fa-headphones"></i> {{i18n.acdc.tabs.agents}}</button>
		</nav>
	</header>
	<main class="acdc-content" aria-live="polite"></main>
</div>
